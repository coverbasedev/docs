# Vale configuration for the Coverbase docs.
#
# Without this file the Mintlify check falls back to a default dictionary that
# does not know the product's vocabulary, so it reports "Coverbase" itself as a
# suspected misspelling. The accept list below is that vocabulary, not a way to
# lower the bar: spelling is still checked against everything else.
StylesPath = styles
MinAlertLevel = suggestion

Vocab = Coverbase

[*.{md,mdx}]
BasedOnStyles = Vale, Coverbase

# These two predate the em dash rule and use "Question? — options" as a layout
# device throughout. Exempt until someone rewrites them; do not add to this list.
[user-guides/irq-library.mdx]
Coverbase.EmDash = NO

[user-guides/dashboard-library.mdx]
Coverbase.EmDash = NO
